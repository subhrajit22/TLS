####################################################################
# ISSUING CA CONFIGURATION
####################################################################

[ ca ]
default_ca = CA_default

####################################################################
# CA DEFAULT SECTION
####################################################################

[ CA_default ]
dir               = /home/ubuntu/ca/issuingca
certs             = $dir/cert
crl_dir           = $dir/crl
new_certs_dir     = $dir/issued_certs
database          = $dir/data/index.dat
serial            = $dir/data/serial.dat
private_key       = $dir/private/issuingca.key
certificate       = $dir/cert/issuingca.cer
crlnumber         = $dir/data/crl_number
crl               = $dir/crl/issuingca.crl

default_md        = sha256
default_days      = 825
default_crl_days  = 15

policy            = policy_strict
email_in_dn       = no
copy_extensions   = copy

name_opt          = ca_default
cert_opt          = ca_default
preserve          = no
unique_subject    = no

####################################################################
# POLICY
####################################################################

[ policy_strict ]
countryName             = supplied
stateOrProvinceName     = optional
localityName            = optional
organizationName        = supplied
organizationalUnitName  = optional
commonName              = supplied
emailAddress            = optional

####################################################################
# REQUEST SECTION
####################################################################

[ req ]
default_bits        = 2048
distinguished_name  = req_distinguished_name
string_mask         = utf8only
default_md          = sha256

[ req_distinguished_name ]
countryName                     = Country Name (2 letter code)
stateOrProvinceName             = State or Province Name
localityName                    = Locality Name
organizationName                = Organization Name
organizationalUnitName          = Organizational Unit Name
commonName                      = Common Name
emailAddress                    = Email Address

countryName_default             = IN
stateOrProvinceName_default     = West Bengal
localityName_default            = Kolkata
organizationName_default        = prm
organizationalUnitName_default  = DevOps
commonName_default              = 140.245.22.16
emailAddress_default            = subhrajit@prmfincon.com

####################################################################
# SERVER CERTIFICATE PROFILE
####################################################################

[ server_cert ]
basicConstraints = critical, CA:FALSE
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer

keyUsage = critical, digitalSignature, keyEncipherment
extendedKeyUsage = serverAuth

crlDistributionPoints = URI:http://ca.local/issuingca.crl
authorityInfoAccess = caIssuers;URI:http://ca.local/issuingca.cer

####################################################################
# CLIENT CERTIFICATE PROFILE
####################################################################

[ client_cert ]
basicConstraints = critical, CA:FALSE
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer

keyUsage = critical, digitalSignature
extendedKeyUsage = clientAuth

crlDistributionPoints = URI:http://ca.local/issuingca.crl
authorityInfoAccess = caIssuers;URI:http://ca.local/issuingca.cer

####################################################################
# CODE SIGNING PROFILE
####################################################################

[ code_signing_cert ]
basicConstraints = critical, CA:FALSE
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer

keyUsage = critical, digitalSignature
extendedKeyUsage = codeSigning

crlDistributionPoints = URI:http://ca.local/issuingca.crl
authorityInfoAccess = caIssuers;URI:http://ca.local/issuingca.cer

####################################################################
# OCSP SIGNING PROFILE
####################################################################

[ ocsp ]
basicConstraints = CA:FALSE
subjectKeyIdentifier = hash
authorityKeyIdentifier = keyid,issuer

keyUsage = critical, digitalSignature
extendedKeyUsage = critical, OCSPSigning

####################################################################
# CRL EXTENSIONS
####################################################################

[ crl_ext ]
authorityKeyIdentifier = keyid:always
